name: CI

# Gate không bypass được: chạy lint + typecheck + format:check + build trên mỗi PR/push.
# GitLab: tái dùng `npm run ci` trong .gitlab-ci.yml.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
